name: Build

# Every push: run the tests and build SkyrimDownloaded.exe (a download under Artifacts).
# To publish a release with the .exe attached, either push a version tag (e.g. v1.6.0), or on
# GitHub: Actions > Build > Run workflow, pick the branch, tick "Publish a release" (the tag
# v<version in skyrimdl/__init__.py> is made for you).
# If SignPath is set up (see SIGNING.md), the .exe is code-signed first.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of this version (tag v<version>) with the .exe"
        type: boolean
        default: false

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(python -c "import skyrimdl; print(skyrimdl.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::Tag v$tag doesn't match the version in skyrimdl/__init__.py ($app)."
            exit 1
          fi
      - name: Build SkyrimDownloaded.exe
        run: |
          python -m pip install pyinstaller pillow
          python -m PyInstaller --onefile --windowed --name SkyrimDownloaded run_skyrimdl.py
      - name: Check it starts
        run: python -c "import skyrimdl.gui, skyrimdl.cli; print('ok')"

      # --- Code signing with SignPath (skipped until it's set up, see SIGNING.md) ---
      - name: Upload the unsigned .exe for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimDownloaded-unsigned
          path: dist/SkyrimDownloaded.exe
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed .exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: |
          signed=$(find signed -iname 'SkyrimDownloaded.exe' | head -n 1)
          if [ -z "$signed" ]; then echo "::error::SignPath returned no SkyrimDownloaded.exe"; exit 1; fi
          cp "$signed" dist/SkyrimDownloaded.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SkyrimDownloaded-windows
          path: dist/SkyrimDownloaded.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SkyrimDownloaded-windows
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 -c 'import skyrimdl; print(skyrimdl.__version__)')"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release called $tag already exists. Bump the version in skyrimdl/__init__.py first."
            exit 1
          fi
          signed="${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}"
          {
            echo "**Download:** \`SkyrimDownloaded.exe\` below - no install or Python needed. Needs a Nexus Mods Premium account."
            echo
            if [ "$signed" != "true" ]; then
              echo "Windows may say *\"Windows protected your PC\"* the first time: click **More info**, then **Run anyway**. The app isn't code-signed yet."
              echo
            fi
            echo "See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/README.md) for how to use it."
          } > notes.md
          gh release create "$tag" dist/SkyrimDownloaded.exe --target "$GITHUB_SHA" \
            --title "SkyrimDownloaded $tag" \
            --notes-file notes.md --generate-notes

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SkyrimDownloaded.exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --windowed --name SkyrimDownloaded run_skyrimdl.py
      - name: Check it starts
        run: python -c "import skyrimdl.gui, skyrimdl.cli; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: SkyrimDownloaded-windows
          path: dist/SkyrimDownloaded.exe

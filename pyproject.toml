[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrimdownloaded"
version = "1.6.1"
description = "Download a list of Nexus Mods links into Mod Organizer 2 or Vortex, choosing each mod's file options"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
skyrimdl = "skyrimdl.cli:main"

[tool.setuptools]
packages = ["skyrimdl", "skyrimdl.managers"]
